# ==============================================================================
# Google Cloud Build Pipeline for Continuous Deployment to Google Cloud Run
# ==============================================================================

steps:
  # Step 1: Build Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sales:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sales:latest'
      - '.'

  # Step 2: Push Container Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sales:$COMMIT_SHA'

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sales'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sales:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'

images:
  - 'gcr.io/$PROJECT_ID/sales:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sales:latest'

options:
  logging: CLOUD_LOGGING_ONLY
